<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理作业评审系统</title>
<style>
  :root {
    --primary: #1e3a5f;
    --primary-light: #2c5282;
    --accent: #3b82f6;
    --accent-light: #60a5fa;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: #e2e8f0;
    --success: #10b981;
    --success-bg: #d1fae5;
    --danger: #ef4444;
    --danger-bg: #fee2e2;
    --warning: #f59e0b;
    --warning-bg: #fef3c7;
    --shadow: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
    padding: 40px 24px 32px;
    text-align: center;
  }

  header .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 3px solid rgba(255,255,255,0.3);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin-bottom: 16px;
  }

  header h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  header p {
    font-size: 15px;
    opacity: 0.85;
    max-width: 560px;
    margin: 0 auto;
  }

  header .badges {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  header .badge {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
  }

  /* ===== Main Layout ===== */
  .container {
    max-width: 860px;
    margin: -20px auto 40px;
    padding: 0 16px;
  }

  /* ===== Upload Card ===== */
  .upload-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    margin-bottom: 24px;
  }

  .upload-card h2 {
    font-size: 20px;
    margin-bottom: 4px;
    color: var(--primary);
  }

  .upload-card .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }

  .form-row {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .form-group {
    flex: 1;
    min-width: 200px;
  }

  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }

  .form-group label .required {
    color: var(--danger);
    margin-left: 2px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #f7fafc;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    background: white;
  }

  .form-group textarea {
    resize: vertical;
    min-height: 160px;
    line-height: 1.7;
  }

  .file-upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #f7fafc;
    position: relative;
  }

  .file-upload-area:hover {
    border-color: var(--accent);
    background: #ebf4ff;
  }

  .file-upload-area.dragover {
    border-color: var(--accent);
    background: #dbeafe;
  }

  .file-upload-area .upload-icon {
    font-size: 32px;
    margin-bottom: 8px;
  }

  .file-upload-area p {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .file-upload-area .file-name {
    margin-top: 8px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
  }

  .file-upload-area input[type="file"] {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--primary-light) 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    margin-top: 8px;
  }

  .submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(59,130,246,0.35);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* ===== Reviewing Animation ===== */
  .reviewing {
    text-align: center;
    padding: 40px 20px;
  }

  .reviewing .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .reviewing p {
    font-size: 15px;
    color: var(--text-secondary);
  }

  .reviewing .dots span {
    animation: dots 1.4s infinite;
    opacity: 0;
  }
  .reviewing .dots span:nth-child(2) { animation-delay: 0.2s; }
  .reviewing .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dots {
    0%, 60%, 100% { opacity: 0; }
    30% { opacity: 1; }
  }

  /* ===== Feedback Card ===== */
  .feedback-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 24px;
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback-header {
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 700;
  }

  .feedback-header.accept { background: var(--success-bg); color: #065f46; }
  .feedback-header.reject { background: var(--danger-bg); color: #991b1b; }

  .feedback-body {
    padding: 24px 28px;
  }

  .feedback-section {
    margin-bottom: 20px;
  }

  .feedback-section:last-child { margin-bottom: 0; }

  .feedback-section h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .feedback-section p,
  .feedback-section li {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  .feedback-section ul {
    list-style: none;
    padding-left: 4px;
  }

  .feedback-section ul li {
    position: relative;
    padding-left: 18px;
    margin-bottom: 4px;
  }

  .feedback-section ul li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: bold;
  }

  .score-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--primary);
    color: white;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 18px;
    font-weight: 700;
  }

  .feedback-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 28px;
    background: #f7fafc;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* ===== History ===== */
  .history-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px 28px;
  }

  .history-card h2 {
    font-size: 18px;
    color: var(--primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== Data Toolbar ===== */
  .data-toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .data-btn {
    padding: 8px 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--text-secondary);
  }

  .data-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #ebf4ff;
  }

  .data-btn.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .data-btn.primary:hover {
    background: var(--primary-light);
    border-color: var(--primary-light);
    color: white;
  }

  .data-btn.danger {
    color: var(--danger);
  }

  .data-btn.danger:hover {
    border-color: var(--danger);
    background: var(--danger-bg);
  }

  .data-status {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    padding: 8px 12px;
    background: #f7fafc;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .data-status .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-secondary);
    flex-shrink: 0;
  }

  .data-status.connected .status-dot { background: var(--success); }
  .data-status.disconnected .status-dot { background: var(--danger); }

  .history-item {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .history-item:last-child { border-bottom: none; }

  .history-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .history-item-title {
    font-size: 15px;
    font-weight: 600;
  }

  .history-item-status {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
  }

  .status-accept { background: var(--success-bg); color: #065f46; }
  .status-reject { background: var(--danger-bg); color: #991b1b; }

  .history-item-meta {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .empty-history {
    text-align: center;
    padding: 24px;
    color: var(--text-secondary);
    font-size: 14px;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--text);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    box-shadow: var(--shadow-lg);
    z-index: 1000;
    transition: transform 0.3s ease;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }

  /* ===== Responsive ===== */
  @media (max-width: 600px) {
    header { padding: 28px 16px 24px; }
    header h1 { font-size: 22px; }
    .upload-card, .history-card { padding: 20px; }
    .form-row { flex-direction: column; gap: 12px; }
    .feedback-meta { flex-direction: column; gap: 6px; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header>
  <div class="avatar">📚</div>
  <h1>物理作业评审系统</h1>
  <p>由大学物理老师在线审阅你的作业，提供专业、严谨的批改意见与修改方向</p>
  <div class="badges">
    <span class="badge">论文与学术指导</span>
    <span class="badge">作业与项目批改</span>
    <span class="badge">学术规范检查</span>
    <span class="badge">成长与规划咨询</span>
  </div>
</header>

<!-- ===== Main ===== -->
<div class="container">

  <!-- Upload Card -->
  <div class="upload-card" id="uploadCard">
    <h2>📝 提交作业</h2>
    <p class="subtitle">请填写以下信息并提交作业内容，老师将进行评审。仅受理物理相关作业。</p>

    <form id="homeworkForm">
      <div class="form-row">
        <div class="form-group">
          <label>姓名 <span class="required">*</span></label>
          <input type="text" id="studentName" placeholder="请输入你的姓名" required>
        </div>
        <div class="form-group">
          <label>学号 <span class="required">*</span></label>
          <input type="text" id="studentId" placeholder="请输入你的学号" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>科目 <span class="required">*</span></label>
          <select id="subject" required>
            <option value="">请选择科目</option>
            <option value="physics">物理学</option>
            <option value="mechanics">力学</option>
            <option value="electromagnetism">电磁学</option>
            <option value="thermodynamics">热学</option>
            <option value="optics">光学</option>
            <option value="modern-physics">近代物理</option>
            <option value="quantum">量子力学</option>
            <option value="math">高等数学</option>
            <option value="chemistry">化学</option>
            <option value="biology">生物</option>
            <option value="cs">计算机科学</option>
            <option value="english">英语</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label>作业标题 <span class="required">*</span></label>
          <input type="text" id="homeworkTitle" placeholder="例：质点运动学练习题" required>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label>作业内容 <span class="required">*</span></label>
        <textarea id="homeworkContent" placeholder="请粘贴或输入你的作业内容（公式、解题过程、分析论述等）..." required></textarea>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label>附件上传（可选）</label>
        <div class="file-upload-area" id="fileArea">
          <div class="upload-icon">📎</div>
          <p>点击或拖拽文件到此处上传</p>
          <div class="file-name" id="fileName"></div>
          <input type="file" id="fileInput">
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">提交评审</button>
    </form>
  </div>

  <!-- Reviewing Animation -->
  <div class="upload-card" id="reviewingCard" style="display:none;">
    <div class="reviewing">
      <div class="spinner"></div>
      <p>老师正在认真评审你的作业<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>
  </div>

  <!-- Feedback Card -->
  <div id="feedbackContainer"></div>

  <!-- History -->
  <div class="history-card">
    <h2>📋 评审记录</h2>
    <div class="data-status disconnected" id="dataStatus">
      <span class="status-dot"></span>
      <span id="dataStatusText">未连接外部数据文件</span>
    </div>
    <div class="data-toolbar">
      <button class="data-btn primary" id="btnLinkFile">🔗 连接数据文件</button>
      <button class="data-btn" id="btnExport">📤 导出数据</button>
      <button class="data-btn" id="btnImport">📥 导入数据</button>
      <button class="data-btn danger" id="btnClear">🗑️ 清空记录</button>
    </div>
    <input type="file" id="importFileInput" accept=".json" style="display:none;">
    <div id="historyList"></div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== 物理科目集合 =====
const PHYSICS_SUBJECTS = new Set([
  'physics', 'mechanics', 'electromagnetism',
  'thermodynamics', 'optics', 'modern-physics', 'quantum'
]);

const PHYSICS_KEYWORDS = [
  '物理', '力学', '电磁', '热学', '光学', '近代物理', '量子',
  '牛顿', '动量', '能量', '速度', '加速度', '力', '功', '功率',
  '波动', '振动', '电场', '磁场', '电流', '电压', '电阻', '电容',
  '公式', '实验', '质点', '刚体', '简谐', '相对论', '普朗克', '薛定谔'
];

const NON_PHYSICS_KEYWORDS = [
  '数学', '高数', '微积分', '线代', '化学', '生物', '英语', '语文',
  '历史', '政治', '地理', '编程', '程序设计', '数据库', '论文写作',
  '商业策划', '市场营销', '经济学'
];

const SUBJECT_LABELS = {
  'physics': '物理学',
  'mechanics': '力学',
  'electromagnetism': '电磁学',
  'thermodynamics': '热学',
  'optics': '光学',
  'modern-physics': '近代物理',
  'quantum': '量子力学',
  'math': '高等数学',
  'chemistry': '化学',
  'biology': '生物',
  'cs': '计算机科学',
  'english': '英语',
  'other': '其他'
};

// ===== DOM =====
const form = document.getElementById('homeworkForm');
const uploadCard = document.getElementById('uploadCard');
const reviewingCard = document.getElementById('reviewingCard');
const feedbackContainer = document.getElementById('feedbackContainer');
const submitBtn = document.getElementById('submitBtn');
const toast = document.getElementById('toast');
const historyList = document.getElementById('historyList');
const fileArea = document.getElementById('fileArea');
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');

let uploadedFile = null;

// ===== 文件上传交互 =====
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) {
    uploadedFile = e.target.files[0];
    fileName.textContent = '已选择: ' + uploadedFile.name;
  }
});

fileArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  fileArea.classList.add('dragover');
});

fileArea.addEventListener('dragleave', () => {
  fileArea.classList.remove('dragover');
});

fileArea.addEventListener('drop', (e) => {
  e.preventDefault();
  fileArea.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) {
    uploadedFile = e.dataTransfer.files[0];
    fileInput.files = e.dataTransfer.files;
    fileName.textContent = '已选择: ' + uploadedFile.name;
  }
});

// ===== Toast 提示 =====
function showToast(msg, type) {
  toast.textContent = msg;
  toast.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ===== 判定作业是否为物理作业 =====
function isPhysicsHomework(subject, title, content, fileName) {
  let physicsScore = 0;
  const detectedKeywords = [];

  // 1. 基于科目下拉框
  if (subject && PHYSICS_SUBJECTS.has(subject)) {
    physicsScore += 40;
  }

  const combinedText = (title + ' ' + content + ' ' + (fileName || '')).toLowerCase();

  // 2. 基于关键词匹配
  for (const kw of PHYSICS_KEYWORDS) {
    if (combinedText.includes(kw)) {
      physicsScore += 10;
      detectedKeywords.push(kw);
      if (physicsScore >= 60) break;
    }
  }

  // 3. 检测非物理关键词降分
  let nonPhysicsCount = 0;
  for (const kw of NON_PHYSICS_KEYWORDS) {
    if (combinedText.includes(kw)) {
      nonPhysicsCount++;
      physicsScore -= 8;
    }
  }

  const isPhysics = physicsScore > 25;

  return {
    isPhysics: isPhysics,
    physicsScore: physicsScore,
    nonPhysicsCount: nonPhysicsCount,
    detectedKeywords: detectedKeywords
  };
}

// ===== 生成评审反馈 =====
function generateFeedback(data, subjectLabel) {
  const content = data.content;
  const wordCount = content.length;
  const hasFormula = /[=∑∫∂√^∞]/.test(content);
  const hasSteps = /(步骤|解|因为|所以|根据|由|可得|因此)/.test(content);
  const hasAnalysis = /(分析|讨论|结论|综上|说明|综上)/.test(content);

  let score = 0;
  let strengths = [];
  let issues = [];
  let suggestions = [];

  // 评分逻辑
  if (wordCount > 500) {
    score += 30;
    strengths.push('作业内容充实，篇幅完整，体现了认真的态度。');
  } else if (wordCount > 200) {
    score += 20;
    strengths.push('作业内容较为完整，有基本的解题呈现。');
  } else {
    score += 10;
    issues.push('作业内容偏少，解题过程不够完整，建议补充更多细节。');
  }

  if (hasFormula) {
    score += 25;
    strengths.push('正确使用了物理公式与数学符号，体现了物理学科素养。');
  } else {
    issues.push('作业中缺少必要的物理公式推导，建议在解题中明确写出关键公式。');
  }

  if (hasSteps) {
    score += 25;
    strengths.push('解题思路清晰，有逻辑步骤的呈现。');
  } else {
    issues.push('解题过程缺少逻辑步骤，建议按照"已知—公式—推导—结论"的结构组织。');
    score += 10;
  }

  if (hasAnalysis) {
    score += 15;
    strengths.push('包含分析与讨论环节，体现了深入思考。');
  } else {
    suggestions.push('建议在解题后增加简要的结果分析与讨论，说明物理意义。');
    score += 5;
  }

  // 学术规范检查
  const hasColloquial = /(我觉得|感觉|应该吧|大概|差不多|好像|随便)/.test(content);
  if (hasColloquial) {
    issues.push('部分表达存在口语化倾向，如"我觉得""感觉""大概"等，需改为客观、严谨的学术表达。');
    score -= 5;
  } else {
    strengths.push('语言表达较为规范，符合学术写作要求。');
  }

  // 附件
  if (data.fileName) {
    strengths.push('已上传附件（' + data.fileName + '），老师将一并参考。');
  }

  score = Math.max(0, Math.min(100, score));

  suggestions.push('注意物理量的单位标注和有效数字的处理。');
  suggestions.push('建议在关键公式旁注明其适用条件与物理依据。');
  suggestions.push('鼓励参考相关文献，拓展对物理问题的理解深度。');

  return {
    score: score,
    strengths: strengths,
    issues: issues,
    suggestions: suggestions,
    rating: score >= 85 ? '优秀' : score >= 70 ? '良好' : score >= 60 ? '合格' : '需改进'
  };
}

// ===== 提交表单 =====
form.addEventListener('submit', (e) => {
  e.preventDefault();

  const name = document.getElementById('studentName').value.trim();
  const studentId = document.getElementById('studentId').value.trim();
  const subject = document.getElementById('subject').value;
  const title = document.getElementById('homeworkTitle').value.trim();
  const content = document.getElementById('homeworkContent').value.trim();

  if (!name || !studentId || !subject || !title || !content) {
    showToast('请填写所有必填项', 'error');
    return;
  }

  submitBtn.disabled = true;
  uploadCard.style.display = 'none';
  reviewingCard.style.display = 'block';
  feedbackContainer.innerHTML = '';

  // 模拟评审延迟
  setTimeout(() => {
    reviewingCard.style.display = 'none';
    submitBtn.disabled = false;

    const data = {
      name: name,
      studentId: studentId,
      subject: subject,
      subjectLabel: SUBJECT_LABELS[subject],
      title: title,
      content: content,
      fileName: uploadedFile ? uploadedFile.name : null
    };

    // 多维度判定是否物理作业
    const check = isPhysicsHomework(subject, title, content, data.fileName);

    if (check.isPhysics) {
      const fb = generateFeedback(data, SUBJECT_LABELS[subject]);
      renderFeedback(data, fb, true, check);
      saveHistory(data, true, fb);
    } else {
      renderReject(data, check);
      saveHistory(data, false, null);
    }

    // 重置表单
    form.reset();
    uploadedFile = null;
    fileName.textContent = '';
    uploadCard.style.display = 'block';

    // 滚动到反馈
    feedbackContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 1800);
});

// ===== 渲染通过反馈 =====
function renderFeedback(data, fb, accepted, check) {
  const dateStr = new Date().toLocaleString('zh-CN');
  const kwDisplay = check.detectedKeywords.length
    ? check.detectedKeywords.slice(0, 5).map(k => `<span style="background:#ebf4ff;color:#2c5282;padding:2px 8px;border-radius:10px;font-size:12px;margin:2px;display:inline-block;">${k}</span>`).join('')
    : '无';
  const html = `
    <div class="feedback-card">
      <div class="feedback-header accept">
        ✅ 评审通过 — ${data.subjectLabel}作业
      </div>
      <div class="feedback-body">
        <div class="feedback-section">
          <h3>🔍 物理属性判定</h3>
          <p>判定结果：<strong style="color:#10b981;">通过</strong> &nbsp; 匹配度评分：${check.physicsScore} 分</p>
          <p style="margin-top:8px;">检测到物理相关关键词：${kwDisplay}</p>
        </div>
        <div class="feedback-section">
          <h3>📊 总体评价</h3>
          <p>
            <span class="score-badge">${fb.score}分</span>
            &nbsp;&nbsp;等级：<strong>${fb.rating}</strong>
          </p>
          <p style="margin-top:10px;">${data.name}同学，你的作业《${data.title}》已完成评审。以下为详细反馈：</p>
        </div>
        <div class="feedback-section">
          <h3>✦ 优点</h3>
          <ul>${fb.strengths.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>
        <div class="feedback-section">
          <h3>⚠ 需要改进</h3>
          <ul>${fb.issues.length ? fb.issues.map(s => `<li>${s}</li>`).join('') : '<li>暂未发现明显问题，保持良好的学习习惯！</li>'}</ul>
        </div>
        <div class="feedback-section">
          <h3>💡 修改建议</h3>
          <ul>${fb.suggestions.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="feedback-meta">
        <span>学生：${data.name}（${data.studentId}）</span>
        <span>${dateStr}</span>
      </div>
    </div>
  `;
  feedbackContainer.innerHTML = html;
}

// ===== 渲染拒绝反馈 =====
function renderReject(data, check) {
  const dateStr = new Date().toLocaleString('zh-CN');
  const reasons = [];
  if (!PHYSICS_SUBJECTS.has(data.subject)) {
    reasons.push('所选科目「' + data.subjectLabel + '」不属于物理类科目。');
  }
  if (check.nonPhysicsCount > 0) {
    reasons.push('内容中检测到非物理学科关键词，疑似提交了其他科目作业。');
  }
  if (check.detectedKeywords.length === 0) {
    reasons.push('标题与内容中未检测到任何物理相关关键词。');
  }

  const html = `
    <div class="feedback-card">
      <div class="feedback-header reject">
        🚫 评审拒绝 — 非物理作业
      </div>
      <div class="feedback-body">
        <div class="feedback-section">
          <h3>🔍 物理属性判定</h3>
          <p>判定结果：<strong style="color:#ef4444;">未通过</strong> &nbsp; 匹配度评分：${check.physicsScore} 分</p>
          <p style="margin-top:8px;">检测到物理关键词：${check.detectedKeywords.length ? check.detectedKeywords.join('、') : '无'}</p>
          <p style="margin-top:8px;">检测到非物理关键词数量：${check.nonPhysicsCount}</p>
        </div>
        <div class="feedback-section">
          <h3>拒绝原因</h3>
          <ul>${reasons.map(r => `<li>${r}</li>`).join('')}</ul>
          <p style="margin-top:10px;">${data.name}同学，本系统仅受理<strong>物理相关作业</strong>（物理学、力学、电磁学、热学、光学、近代物理、量子力学等）。</p>
          <p style="margin-top:6px;">请你联系对应科目的老师进行评审，或重新提交物理类作业。感谢理解！</p>
        </div>
      </div>
      <div class="feedback-meta">
        <span>学生：${data.name}（${data.studentId}）</span>
        <span>${dateStr}</span>
      </div>
    </div>
  `;
  feedbackContainer.innerHTML = html;
  showToast('该作业未通过物理属性判定', 'error');
}

// ===== 历史记录存储（外部文件 + localStorage 回退）=====
const DATA_FILE_NAME = '评审记录.json';
let fileHandle = null;  // File System Access API 文件句柄
let useExternalFile = false;  // 是否已连接外部文件
let historyData = [];  // 内存中的评审记录

const dataStatusEl = document.getElementById('dataStatus');
const dataStatusText = document.getElementById('dataStatusText');

// ===== 检测 File System Access API 支持 =====
const supportsFSAccess = 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;

// ===== 从 localStorage 加载（回退方案）=====
function loadFromLocalStorage() {
  try {
    return JSON.parse(localStorage.getItem('hwHistory') || '[]');
  } catch (e) {
    return [];
  }
}

// ===== 保存到 localStorage（回退方案）=====
function saveToLocalStorage(data) {
  localStorage.setItem('hwHistory', JSON.stringify(data));
}

// ===== 连接外部数据文件 =====
async function linkDataFile() {
  if (!supportsFSAccess) {
    showToast('当前浏览器不支持文件连接，请使用导入/导出功能', 'error');
    return;
  }
  try {
    const handle = await window.showOpenFilePicker({
      types: [{ description: 'JSON 数据文件', accept: { 'application/json': ['.json'] } }],
      multiple: false
    });
    const file = await handle.getFile();
    const text = await file.text();
    let data = [];
    try {
      data = JSON.parse(text);
      if (!Array.isArray(data)) throw new Error('数据格式不正确');
    } catch (e) {
      // 文件为空或格式不正确，初始化为空数组
      data = [];
    }
    fileHandle = handle;
    useExternalFile = true;
    historyData = data;
    renderHistory();
    updateDataStatus();
    showToast('已连接数据文件: ' + file.name, 'success');
  } catch (e) {
    if (e.name !== 'AbortError') {
      showToast('连接文件失败: ' + e.message, 'error');
    }
  }
}

// ===== 写入外部文件 =====
async function writeToExternalFile(data) {
  if (!useExternalFile || !fileHandle) return;
  try {
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
  } catch (e) {
    showToast('写入文件失败，已回退到本地存储', 'error');
    saveToLocalStorage(data);
  }
}

// ===== 更新状态指示 =====
function updateDataStatus() {
  if (useExternalFile) {
    dataStatusEl.className = 'data-status connected';
    dataStatusText.textContent = '已连接外部数据文件 — 记录将自动保存到文件';
  } else {
    dataStatusEl.className = 'data-status disconnected';
    dataStatusText.textContent = supportsFSAccess
      ? '未连接外部数据文件 — 当前使用浏览器本地存储（点击「连接数据文件」切换）'
      : '当前浏览器不支持文件连接 — 使用浏览器本地存储（可手动导入/导出）';
  }
}

// ===== 导出数据为 JSON 文件 =====
function exportData() {
  const dataStr = JSON.stringify(historyData, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = DATA_FILE_NAME;
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出为 ' + DATA_FILE_NAME, 'success');
}

// ===== 导入数据 =====
async function importData(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data)) throw new Error('数据格式不正确，应为数组');
    historyData = data;
    if (useExternalFile && fileHandle) {
      await writeToExternalFile(historyData);
    } else {
      saveToLocalStorage(historyData);
    }
    renderHistory();
    showToast('成功导入 ' + data.length + ' 条记录', 'success');
  } catch (e) {
    showToast('导入失败: ' + e.message, 'error');
  }
}

// ===== 清空记录 =====
async function clearHistory() {
  if (historyData.length === 0) {
    showToast('没有可清空的记录', 'error');
    return;
  }
  if (!confirm('确定要清空所有评审记录吗？此操作不可撤销。')) return;
  historyData = [];
  if (useExternalFile && fileHandle) {
    await writeToExternalFile(historyData);
  } else {
    saveToLocalStorage(historyData);
  }
  renderHistory();
  showToast('评审记录已清空', 'success');
}

// ===== 保存历史记录 =====
function saveHistory(data, accepted, fb) {
  historyData.unshift({
    name: data.name,
    studentId: data.studentId,
    subject: data.subjectLabel,
    title: data.title,
    accepted: accepted,
    score: fb ? fb.score : null,
    rating: fb ? fb.rating : null,
    time: new Date().toLocaleString('zh-CN')
  });
  if (historyData.length > 50) historyData.pop();
  if (useExternalFile && fileHandle) {
    writeToExternalFile(historyData);
  } else {
    saveToLocalStorage(historyData);
  }
  renderHistory();
}

// ===== 渲染历史记录 =====
function renderHistory() {
  if (historyData.length === 0) {
    historyList.innerHTML = '<div class="empty-history">暂无评审记录</div>';
    return;
  }
  historyList.innerHTML = historyData.map(h => `
    <div class="history-item">
      <div class="history-item-header">
        <span class="history-item-title">${h.title}</span>
        <span class="history-item-status ${h.accepted ? 'status-accept' : 'status-reject'}">
          ${h.accepted ? '✅ ' + h.score + '分 ' + h.rating : '🚫 已拒绝'}
        </span>
      </div>
      <div class="history-item-meta">
        ${h.name}（${h.studentId}）· ${h.subject} · ${h.time}
      </div>
    </div>
  `).join('');
}

// ===== 初始化 =====
// 优先尝试从 localStorage 加载（如果未连接外部文件）
historyData = loadFromLocalStorage();
renderHistory();
updateDataStatus();

// ===== 绑定工具栏按钮 =====
document.getElementById('btnLinkFile').addEventListener('click', linkDataFile);
document.getElementById('btnExport').addEventListener('click', exportData);
document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('importFileInput').click();
});
document.getElementById('importFileInput').addEventListener('change', (e) => {
  if (e.target.files.length > 0) {
    importData(e.target.files[0]);
    e.target.value = '';
  }
});
document.getElementById('btnClear').addEventListener('click', clearHistory);
</script>
